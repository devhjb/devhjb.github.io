<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <title>{% if page.url == "/" %}{{ site.title }} | {{ site.tagline }}{% elsif page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} | {{ site.tagline }}{% endif %}</title>
    <link rel="shortcut icon" href="/assets/site/favicon.ico?v=2608241">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/site/favicon-32.png?v=2608241">
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/site/favicon-192.png?v=2608241">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/site/apple-touch-icon.png?v=2608241">
    <link rel="stylesheet" href="/styles.css?v=2608237">
  </head>
  <body>
    <header class="site-header">
      <nav class="nav" aria-label="主导航">
        <a class="brand" href="/" aria-label="Jabbey 首页">
          <span class="brand-mark">J</span>
          <span class="brand-copy">
            <strong>Jabbey</strong>
            <small>engineering journal</small>
          </span>
        </a>
        <div class="nav-links">
          <a href="/#writing">文章</a>
          <a href="/#coordinate">坐标</a>
          <a href="/#about">关于</a>
          <a href="/#links">链接</a>
        </div>
      </nav>
    </header>

    {{ content }}

    <footer class="site-footer">
      <p>© 2026 Jabbey. Business systems, debugging evidence, and engineering workflow notes.</p>
    </footer>
  </body>
</html>
